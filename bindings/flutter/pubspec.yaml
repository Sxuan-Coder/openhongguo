name: openhongguo
description: An unofficial Flutter SDK for browsing, searching and playing short dramas anonymously, backed by a Go-compiled native library.
version: 0.4.1
repository: https://github.com/beilunyang/openhongguo/tree/main/bindings/flutter
issue_tracker: https://github.com/beilunyang/openhongguo/issues
topics:
  - hongguo
  - short-drama
  - sdk

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.openhongguo.flutter
        pluginClass: OpenhongguoPlugin
      ios:
        pluginClass: OpenhongguoPlugin
      windows:
        pluginClass: OpenhongguoPlugin
